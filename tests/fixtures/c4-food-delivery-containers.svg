  <text data-label="r1-label" data-label-for="r1" class="rel-label" x="195" y="236" text-anchor="middle" font-size="11"><tspan x="195">Orders and tracks</tspan></text>
  <text data-label="r2-label" data-label-for="r2" class="rel-label" x="575" y="236" text-anchor="middle" font-size="11"><tspan x="575">Manages menus</tspan></text>
  <text data-label="r3-label" data-label-for="r3" class="rel-label" x="955" y="236" text-anchor="middle" font-size="11"><tspan x="955">Accepts jobs</tspan></text>
  <text data-label="r4-label" data-label-for="r4" class="rel-label" x="1335" y="236" text-anchor="middle" font-size="11"><tspan x="1335">Handles disputes</tspan></text>
  <text data-label="r5-label" data-label-for="r5" class="rel-label" x="452.5" y="406" text-anchor="middle" font-size="11"><tspan x="452.5">Calls API</tspan><tspan x="452.5" dy="14">[HTTPS/JSON]</tspan></text>
  <text data-label="r6-label" data-label-for="r6" class="rel-label" x="642.5" y="406" text-anchor="middle" font-size="11"><tspan x="642.5">Calls API</tspan><tspan x="642.5" dy="14">[HTTPS/JSON]</tspan></text>
  <text data-label="r7-label" data-label-for="r7" class="rel-label" x="832.5" y="406" text-anchor="middle" font-size="11"><tspan x="832.5">Calls API</tspan><tspan x="832.5" dy="14">[HTTPS/JSON]</tspan></text>
  <text data-label="r8-label" data-label-for="r8" class="rel-label" x="1022.5" y="406" text-anchor="middle" font-size="11"><tspan x="1022.5">Calls API</tspan><tspan x="1022.5" dy="14">[HTTPS/JSON]</tspan></text>
  <text data-label="r9-label" data-label-for="r9" class="rel-label" x="1310" y="326" text-anchor="middle" font-size="11"><tspan x="1310">Navigates with</tspan><tspan x="1310" dy="14">[SDK]</tspan></text>
  <text data-label="r10-label" data-label-for="r10" class="rel-label" x="452.5" y="566" text-anchor="middle" font-size="11"><tspan x="452.5">Verifies tokens</tspan><tspan x="452.5" dy="14">[gRPC]</tspan></text>
  <text data-label="r11-label" data-label-for="r11" class="rel-label" x="597.5" y="566" text-anchor="middle" font-size="11"><tspan x="597.5">Routes orders</tspan><tspan x="597.5" dy="14">[gRPC]</tspan></text>
  <text data-label="r12-label" data-label-for="r12" class="rel-label" x="742.5" y="566" text-anchor="middle" font-size="11"><tspan x="742.5">Routes menu calls</tspan><tspan x="742.5" dy="14">[gRPC]</tspan></text>
  <text data-label="r13-label" data-label-for="r13" class="rel-label" x="887.5" y="566" text-anchor="middle" font-size="11"><tspan x="887.5">Routes courier calls</tspan><tspan x="887.5" dy="14">[gRPC]</tspan></text>
  <text data-label="r14-label" data-label-for="r14" class="rel-label" x="1022.5" y="566" text-anchor="middle" font-size="11"><tspan x="1022.5">Routes refunds</tspan><tspan x="1022.5" dy="14">[gRPC]</tspan></text>
  <text data-label="r15-label" data-label-for="r15" class="rel-label" x="195" y="746" text-anchor="middle" font-size="11"><tspan x="195">Reads and writes</tspan><tspan x="195" dy="14">[SQL]</tspan></text>
  <text data-label="r16-label" data-label-for="r16" class="rel-label" x="485" y="746" text-anchor="middle" font-size="11"><tspan x="485">Reads and writes</tspan><tspan x="485" dy="14">[JDBC]</tspan></text>
  <text data-label="r17-label" data-label-for="r17" class="rel-label" x="910" y="646" text-anchor="middle" font-size="11"><tspan x="910">Charges orders</tspan><tspan x="910" dy="14">[gRPC]</tspan></text>
  <text data-label="r18-label" data-label-for="r18" class="rel-label" x="775" y="746" text-anchor="middle" font-size="11"><tspan x="775">Publishes order events</tspan><tspan x="775" dy="14">[Kafka]</tspan></text>
  <text data-label="r19-label" data-label-for="r19" class="rel-label" x="775" y="746" text-anchor="middle" font-size="11"><tspan x="775">Indexes menus</tspan><tspan x="775" dy="14">[HTTPS]</tspan></text>
  <text data-label="r20-label" data-label-for="r20" class="rel-label" x="1065" y="746" text-anchor="middle" font-size="11"><tspan x="1065">Subscribes to orders</tspan><tspan x="1065" dy="14">[Kafka]</tspan></text>
  <text data-label="r21-label" data-label-for="r21" class="rel-label" x="1200" y="746" text-anchor="middle" font-size="11"><tspan x="1200">Tracks couriers</tspan><tspan x="1200" dy="14">[RESP]</tspan></text>
  <text data-label="r22-label" data-label-for="r22" class="rel-label" x="1365" y="486" text-anchor="middle" font-size="11"><tspan x="1365">Gets routes and ETAs</tspan><tspan x="1365" dy="14">[HTTPS]</tspan></text>
  <text data-label="r23-label" data-label-for="r23" class="rel-label" x="1500" y="646" text-anchor="middle" font-size="11"><tspan x="1500">Captures payments</tspan><tspan x="1500" dy="14">[HTTPS]</tspan></text>
