<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="600" height="330" fill="white"/>
  <g data-node="user">
    <rect x="20" y="30" width="90" height="44" fill="#eef" stroke="#333"/>
    <text x="65" y="57" text-anchor="middle" font-size="14">User</text>
  </g>
  <g data-node="web">
    <rect x="170" y="30" width="100" height="44" fill="#fff" stroke="#333"/>
    <text x="220" y="57" text-anchor="middle" font-size="14">Web app</text>
  </g>
  <g data-node="gateway">
    <rect x="330" y="30" width="70" height="44" fill="#fff" stroke="#333"/>
    <text x="365" y="57" text-anchor="middle" font-size="14">API gateway</text>
  </g>
  <g data-node="auth">
    <rect x="300" y="130" width="90" height="44" fill="#fff" stroke="#333"/>
    <text x="345" y="157" text-anchor="middle" font-size="14">Auth</text>
  </g>
  <g data-node="orders">
    <rect x="150" y="200" width="110" height="44" fill="#fff" stroke="#333"/>
    <text x="205" y="227" text-anchor="middle" font-size="14">Orders</text>
  </g>
  <g data-node="payments">
    <rect x="240" y="225" width="110" height="44" fill="#fff" stroke="#333"/>
    <text x="295" y="252" text-anchor="middle" font-size="14">Payments</text>
  </g>
  <g data-node="db">
    <rect x="520" y="200" width="120" height="44" fill="#ffe" stroke="#333"/>
    <text x="580" y="227" text-anchor="middle" font-size="14">Orders DB</text>
  </g>
  <path id="browse" data-from="user" data-to="web" d="M 110 52 L 170 52" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="call" data-from="web" data-to="gateway" d="M 270 60 L 330 45" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="verify" data-from="gateway" data-to="auth" d="M 365 74 L 365 150" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="place" data-from="gateway" data-to="orders" d="M 340 74 L 340 222 L 260 222" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="charge" data-from="orders" data-to="payments" d="M 205 244 L 205 300 L 295 300 L 295 269" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="save" data-from="orders" data-to="db" d="M 260 210 L 520 210" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path id="receipt" data-from="payments" data-to="user" d="M 240 247 L 65 247 L 65 74" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text data-label="place-label" data-label-for="place" x="356" y="120" font-size="12">place order</text>
  <text data-label="receipt-label" data-label-for="receipt" x="110" y="298" font-size="12">receipt</text>
  <text data-label="save-label" data-label-for="save" x="430" y="200" font-size="12">save</text>
  <text data-label="browse-label" data-label-for="browse" x="122" y="45" font-size="12">browse</text>
  <text data-label="call-label" data-label-for="call" x="278" y="40" font-size="12">request</text>
  <text data-label="verify-label" data-label-for="verify" x="386" y="90" font-size="12">verify token</text>
  <text data-label="charge-label" data-label-for="charge" x="215" y="315" font-size="12">charge</text>
</svg>
