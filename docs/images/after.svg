<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="660" height="330" fill="white" x="0" y="0"/>
  <g data-node="user">
    <rect x="20" y="30" width="90" height="44" fill="#eef" stroke="#333"/>
    <text x="65" y="57" text-anchor="middle" font-size="14">User</text>
  </g>
  <g data-node="web">
    <rect x="170" y="30" width="100" height="44" fill="#fff" stroke="#333"/>
    <text x="220" y="57" text-anchor="middle" font-size="14">Web app</text>
  </g>
  <g data-node="gateway" transform="translate(40 0)">
    <rect x="307.5" y="30" width="115" height="44" fill="#fff" stroke="#333"/>
    <text x="365" y="57" text-anchor="middle" font-size="14">API gateway</text>
  </g>
  <g data-node="auth">
    <rect x="300" y="130" width="90" height="44" fill="#fff" stroke="#333"/>
    <text x="345" y="157" text-anchor="middle" font-size="14">Auth</text>
  </g>
  <g data-node="orders" transform="translate(20 0)">
    <rect x="150" y="200" width="110" height="44" fill="#fff" stroke="#333"/>
    <text x="205" y="227" text-anchor="middle" font-size="14">Orders</text>
  </g>
  <g data-node="payments" transform="translate(40 40)">
    <rect x="240" y="225" width="110" height="44" fill="#fff" stroke="#333"/>
    <text x="295" y="252" text-anchor="middle" font-size="14">Payments</text>
  </g>
  <g data-node="db">
    <rect x="520" y="200" width="120" height="44" fill="#ffe" stroke="#333"/>
    <text x="580" y="227" text-anchor="middle" font-size="14">Orders DB</text>
  </g>
  <path id="browse" data-from="user" data-to="web" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 110 52 L 170 52"/>
  <path id="call" data-from="web" data-to="gateway" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 270 52 L 347.5 52"/>
  <path id="verify" data-from="gateway" data-to="auth" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 424 74 L 424 152 L 390 152"/>
  <path id="place" data-from="gateway" data-to="orders" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 386 74 L 386 102 L 225 102 L 225 200"/>
  <path id="charge" data-from="orders" data-to="payments" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 280 229 L 335 229 L 335 265"/>
  <path id="save" data-from="orders" data-to="db" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 280 215 L 520 215"/>
  <path id="receipt" data-from="payments" data-to="user" fill="none" stroke="#333" marker-end="url(#arrow)" d="M 280 287 L 65 287 L 65 74"/>
  <text data-label="place-label" data-label-for="place" x="216" y="156" font-size="12" text-anchor="end">place order</text>
  <text data-label="receipt-label" data-label-for="receipt" x="74" y="186" font-size="12" text-anchor="start">receipt</text>
  <text data-label="save-label" data-label-for="save" x="400" y="204" font-size="12" text-anchor="middle">save</text>
</svg>
