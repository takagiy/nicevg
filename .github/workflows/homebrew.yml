name: Update the Homebrew tap

# Points takagiy/homebrew-tap's formula at a `v*` tag's source archive,
# with its checksum, and commits that straight to the tap's main branch.
#
# The tap is another repository, which this run's GITHUB_TOKEN cannot
# write to: the HOMEBREW_TAP_TOKEN secret is a fine-grained token with
# write access to the contents of takagiy/homebrew-tap only.
#
# Actions from outside GitHub are pinned to commits: a moved tag cannot
# change what writes to the tap.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  formula:
    name: Bump the formula
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: nicevg
          homebrew-tap: takagiy/homebrew-tap
          base-branch: main
          create-pullrequest: false
          commit-message: "{{formulaName}} {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
