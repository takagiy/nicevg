name: Publish to npm

# Publishes bindings/js as the npm package `nicevg`, with the native library
# prebuilt for each platform inside it, so installing runs no script.
#
# A `v*` tag publishes; running it by hand only builds, tests and packs.
# Either way the packed package is kept as the run's `npm-package` artifact,
# for the first publish, which has to be done by hand (see
# bindings/js/README.md).
#
# Actions from outside GitHub are pinned to commits, as they run in a job
# whose output is published: a moved tag cannot change what ships.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller libraries to ship: no symbols in them.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  native:
    name: Native library (${{ matrix.platform }})
    strategy:
      matrix:
        # Each on a runner of its own platform, so the library is tested
        # where it is built.
        include:
          # Linux builds go through zig for glibc 2.17, so they load on
          # distributions far older than the runner.
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: true, file: libnicevg_ffi.so }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, zig: true, file: libnicevg_ffi.so }
          - { platform: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, file: libnicevg_ffi.dylib }
          # GitHub's last Intel macOS runner, until autumn 2027.
          - { platform: darwin-x64, os: macos-15-intel, target: x86_64-apple-darwin, file: libnicevg_ffi.dylib }
          - { platform: win32-x64, os: windows-latest, target: x86_64-pc-windows-msvc, file: nicevg_ffi.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # Caches saved on a tag serve no other run.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
      - if: matrix.zig
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --locked -p nicevg-ffi --target ${{ matrix.target }}.2.17
      - if: ${{ !matrix.zig }}
        run: cargo build --release --locked -p nicevg-ffi --target ${{ matrix.target }}
      - name: Place the library where the package looks for it
        shell: bash
        run: |
          mkdir -p "bindings/js/native/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" "bindings/js/native/${{ matrix.platform }}/"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The package finds the library by the platform it runs on, so this
      # also checks the library sits under the right name.
      - name: Test the library on Bun
        working-directory: bindings/js
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test:bun
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: bindings/js/native/
          if-no-files-found: error

  publish:
    name: Test and publish
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm takes the run's OIDC identity instead of a
      # token, and adds provenance linking the package to this run.
      id-token: write
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # npm 11.5.1 or later publishes through OIDC; Node 24 ships it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: bindings/js/native
          merge-multiple: true
      - name: Check every platform's library is there
        run: |
          for file in linux-x64/libnicevg_ffi.so linux-arm64/libnicevg_ffi.so darwin-arm64/libnicevg_ffi.dylib \
            darwin-x64/libnicevg_ffi.dylib win32-x64/nicevg_ffi.dll; do
            test -f "native/$file" || { echo "missing native/$file"; exit 1; }
          done
          ls -lR native
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:js
      - run: bun run typecheck
      # On Bun and Node, with the Linux library from the package.
      - run: bun run test
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: bindings/js/nicevg-*.tgz
          if-no-files-found: error
      # The package just packed and tested, published with no token.
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm publish ./nicevg-*.tgz
